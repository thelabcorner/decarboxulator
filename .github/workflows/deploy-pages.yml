name: Deploy Decarboxulator V4
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: decarboxulator-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v4 source
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify scientific and application tests
        run: npm test
      - name: Build prerendered GitHub Pages site
        run: |
          if [ "${{ vars.DCX_CUSTOM_DOMAIN }}" = "dcxr.thedabcorner.site" ]; then
            npm run build:domain
          else
            npm run build:pages
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static output
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to Pages
        uses: actions/deploy-pages@v4
